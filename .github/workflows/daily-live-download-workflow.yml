name: Daily Live Download Test

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  live-download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Prepare runtime files in bin
        run: |
          mkdir -p bin/data
          cp -f connection.json bin/connection.json
          cp -f data/config.json bin/data/config.json
          cp -f data/currencies_names_and_codes.json bin/data/currencies_names_and_codes.json

      - name: Run live download test
        env:
          RUN_LIVE_DOWNLOAD_TEST: "1"
          PYTEST_USE_LOCAL_DATA: "0"
        run: pytest tests/test_live_download.py --verbose
